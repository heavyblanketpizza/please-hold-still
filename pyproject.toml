[project]
name = "please-hold-still"
version = "0.1.0"
description = "Self-supervised 3D brain-MRI encoder: continued V-JEPA 2.1 pretraining on OpenMind"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "einops>=0.8.2",
    "huggingface-hub>=0.34",
    "matplotlib>=3.11.2",
    "monai>=1.6.0",
    "nibabel>=5.4.2",
    "numpy>=1.26",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "timm>=1.0.30",
    "torch>=2.14.0",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.uv]
# Only resolve for the two machines we actually use: an Apple-silicon Mac and
# Linux (cloud / CI). PyTorch has no wheels for Intel Macs, so leaving that
# platform in would make `uv lock` fail.
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Training tests write GBs of checkpoints; only keep temp files of failed tests.
tmp_path_retention_policy = "failed"
# Deprecation noise from inside Meta's vjepa2 code, not ours.
filterwarnings = ["ignore:.*sdp_kernel.*:FutureWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
